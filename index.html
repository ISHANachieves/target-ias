  {
    id: "gs-econ-01",
    title: "GS Sectional 01: Indian Economy & Labour Codes",
    category: "GS Sectional",
    paperType: "GS",

/* ========================
   STATE & PERSISTENCE
   ======================== */
const LS_KEYS = {
  USER: "tias_user_v1",
  TESTS: "tias_tests_v1",
  ATTEMPTS: "tias_attempts_v1",
  BOOKMARKS: "tias_bookmarks_v1",
  CONFIG: "tias_config_v1"
};

let state = {
  view: "landing", // landing | dashboard | exam | results | bookmarks | pricing | admin
  user: JSON.parse(localStorage.getItem(LS_KEYS.USER) || "null"),
  tests: JSON.parse(localStorage.getItem(LS_KEYS.TESTS) || "null") || DEFAULT_TESTS,
  attempts: JSON.parse(localStorage.getItem(LS_KEYS.ATTEMPTS) || "[]"),
  bookmarks: JSON.parse(localStorage.getItem(LS_KEYS.BOOKMARKS) || "[]"),
  config: JSON.parse(localStorage.getItem(LS_KEYS.CONFIG) || "null") || {
    bundlePrice: 1499,
    couponCode: "TARGET20",
    couponDiscount: 20,
    externalCheckoutUrl: "", // Optional free payment link (Topmate / Razorpay Payment Page)
    adminPasscode: "target2026",
    supportEmail: "support@targetias.in"
  },
  // Live Exam State
  activeTest: null,
  qIndex: 0,
  answers: {},      // { qIdx: optIdx }
  visited: {},      // { qIdx: true }
  marked: {},       // { qIdx: true }
  strikes: {},      // { "qIdx-optIdx": true }
  timeSpent: {},    // { qIdx: seconds }
  remainingSecs: 0,
  timerId: null,
  paletteOpen: false,
  // Results State
  activeAttemptId: null,
  reviewFilter: "all",
  appliedCoupon: "",
  adminUnlocked: false

function saveState() {
  localStorage.setItem(LS_KEYS.USER, JSON.stringify(state.user));
  localStorage.setItem(LS_KEYS.TESTS, JSON.stringify(state.tests));
  localStorage.setItem(LS_KEYS.ATTEMPTS, JSON.stringify(state.attempts));
  localStorage.setItem(LS_KEYS.BOOKMARKS, JSON.stringify(state.bookmarks));
  localStorage.setItem(LS_KEYS.CONFIG, JSON.stringify(state.config));
}

function isPaid() {
  return state.user && state.user.plan === "paid";
}

function updateHeader() {
  const btn = document.getElementById("nav-user-btn");
  const badge = document.getElementById("nav-badge");
  if (state.user) {
    btn.textContent = state.user.email.split("@")[0];
    badge.classList.remove("hidden");
    badge.classList.add("sm:inline-flex");
    if (isPaid()) {
      badge.textContent = "PRO UNLOCKED";
      badge.className = "hidden sm:inline-flex text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
    } else {
      badge.textContent = "Free Plan";
      badge.className = "hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700";
    }
  } else {
    btn.textContent = "Sign In";
    badge.classList.add("hidden");
  }
}

function setWatermark(active) {
  const wm = document.getElementById("watermark");
  if (!active) {
    wm.classList.add("hidden");
    document.body.classList.remove("no-copy");
    document.oncontextmenu = null;
    return;
  }
  const label = state.user ? state.user.email : "aspirant@targetias.in";
  wm.innerHTML = Array(12).fill(`<div class="text-slate-900 font-bold text-sm tracking-widest uppercase whitespace-nowrap">${escapeHtml(label)} • TARGET-IAS</div>`).join("");
  wm.classList.remove("hidden");
  document.body.classList.add("no-copy");
  document.oncontextmenu = () => false;
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
}

function navigate(view) {
  if (state.view === "exam" && view !== "exam") {
    if (!confirm("Leave the live mock test? Your current timer will stop.")) return;
    stopTimer();
  }
  state.view = view;
  setWatermark(view === "exam" || view === "results");
  document.getElementById("site-footer").classList.toggle("hidden", view === "exam");
  document.getElementById("mobile-nav").classList.toggle("hidden", view === "exam");
  window.scrollTo(0, 0);
  render();
}

/* ========================
   AUTH & MODALS
   ======================== */
function showModal(html) {
  const overlay = document.getElementById("modal-overlay");
  document.getElementById("modal-box").innerHTML = html;
  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}
function closeModal() {
  const overlay = document.getElementById("modal-overlay");
  overlay.classList.add("hidden");
  overlay.classList.remove("flex");
}

function openLoginModal(onSuccess) {
  window._afterLogin = onSuccess || null;
  const existingEmail = state.user ? state.user.email : "";
  showModal(`
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold text-slate-900">Sign In to TARGET-IAS</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
    </div>
    <p class="text-xs text-slate-500 mb-4">Enter your email to track scores, bookmarks, and unlock mock tests. Your email also serves as your exam screen watermark.</p>
    <form onsubmit="handleLogin(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input id="login-email" type="email" required value="${escapeHtml(existingEmail)}" placeholder="aspirant@example.com" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-slate-900 outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
        <input id="login-name" type="text" required value="${escapeHtml(state.user?.name || "")}" placeholder="Your Name" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-slate-900 outline-none" />
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm">Continue</button>
    </form>
    ${state.user ? `<button onclick="logout()" class="mt-3 w-full py-2 text-xs text-red-600 font-semibold hover:underline">Sign Out</button>` : ""}
  `);
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const name = document.getElementById("login-name").value.trim();
  const prevPlan = state.user && state.user.email === email ? state.user.plan : "free";
  state.user = { email, name, plan: prevPlan };

      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        coupon: state.appliedCoupon,
        email: state.user.email
      })
    });

    const orderData = await orderRes.json();
    if (!orderRes.ok) {

    // 2. Open Razorpay Standard Checkout Modal (UPI, Cards, Netbanking)

      key: orderData.keyId,

      handler: async function (response) {

          method: "POST",

          updateHeader();

function startTest(testId) {
  const test = state.tests.find(t => t.id === testId);

  if (!state.user) {
    openLoginModal(() => startTest(testId));
    return;
  }
  if (!test.isFree && !isPaid()) {
    navigate("pricing");
    return;
  }
  state.activeTest = test;
  state.qIndex = 0;
  state.answers = {};
  state.visited = { 0: true };
  state.marked = {};
  state.strikes = {};
  state.timeSpent = {};
  state.remainingSecs = (test.durationMins || 120) * 60;
  state.paletteOpen = false;
  navigate("exam");
  startTimer();
}

function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.remainingSecs--;
    state.timeSpent[state.qIndex] = (state.timeSpent[state.qIndex] || 0) + 1;
    const timerEl = document.getElementById("exam-timer");
    if (timerEl) {
      timerEl.textContent = formatTime(state.remainingSecs);
      if (state.remainingSecs <= 900) {
        timerEl.classList.add("bg-red-600", "text-white", "animate-pulse");
        timerEl.classList.remove("bg-slate-800", "text-emerald-300");
      }
    }
    if (state.remainingSecs <= 0) {
      stopTimer();
      submitExam(true);
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function formatTime(secs) {
  const s = Math.max(0, secs);
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return `${h}:${m}:${sec}`;
}

function selectOption(optIdx) {
  state.answers[state.qIndex] = optIdx;
  render();
}
function toggleStrike(e, optIdx) {
  e.stopPropagation();
  const key = `${state.qIndex}-${optIdx}`;
  state.strikes[key] = !state.strikes[key];

}
function clearResponse() {

  const total = state.activeTest.questions.length;

  showModal(`
    <h3 class="text-lg font-bold text-slate-900 mb-2">Submit ${escapeHtml(state.activeTest.title)}?</h3>
    <p class="text-sm text-slate-600 mb-4">You have answered <strong>${answered}</strong> out of <strong>${total}</strong> questions. Unanswered questions carry zero negative marks.</p>
    <div class="flex gap-3">
      <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-slate-300 font-semibold text-sm">Resume Test</button>
      <button onclick="closeModal(); submitExam(false);" class="flex-1 py-2.5 rounded-lg bg-slate-900 text-white font-semibold text-sm">Confirm Submit</button>
    </div>
  `);
}

function submitExam(auto) {
  stopTimer();
  const test = state.activeTest;
  const posMark = test.paperType === "CSAT" ? 2.5 : 2.0;
  const negMark = test.paperType === "CSAT" ? 0.83 : 0.66;
  let correct = 0, incorrect = 0, unattempted = 0;
  const subjectStats = {};

  test.questions.forEach((q, i) => {
    if (!subjectStats[q.subject]) subjectStats[q.subject] = { correct: 0, total: 0 };
    subjectStats[q.subject].total++;
    if (state.answers[i] === undefined) {
      unattempted++;
    } else if (state.answers[i] === q.correct) {
      correct++;
      subjectStats[q.subject].correct++;
    } else {
      incorrect++;
    }
  });

  const netScore = Number(((correct * posMark) - (incorrect * negMark)).toFixed(2));
  const negLost = Number((incorrect * negMark).toFixed(2));
  const attempted = correct + incorrect;
  const accuracy = attempted ? Math.round((correct / attempted) * 100) : 0;
  const maxScore = Number((test.questions.length * posMark).toFixed(2));

  const attempt = {
    id: "att_" + Date.now(),
    testId: test.id,
    testTitle: test.title,
    paperType: test.paperType,
    date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }),
    netScore,
    maxScore,
    negLost,
    accuracy,
    correct,
    incorrect,
    unattempted,
    answers: { ...state.answers },
    marked: { ...state.marked },
    timeSpent: { ...state.timeSpent },
    mistakeTags: {},
    subjectStats
  };

  state.attempts.unshift(attempt);
  state.activeAttemptId = attempt.id;
  state.reviewFilter = "all";
  saveState();
  navigate("results");
}

function toggleBookmark(testId, qNo) {
  const key = `${testId}::${qNo}`;
  const idx = state.bookmarks.indexOf(key);
  if (idx >= 0) state.bookmarks.splice(idx, 1);
  else state.bookmarks.push(key);
  saveState();
  render();
}

function setMistakeTag(attemptId, qIdx, tag) {
  const att = state.attempts.find(a => a.id === attemptId);
  if (!att) return;
  att.mistakeTags[qIdx] = att.mistakeTags[qIdx] === tag ? "" : tag;
  saveState();
  render();
}

function parseCSV(text) {
  const rows = [];
  let row = [], col = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { col += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else col += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ",") { row.push(col.trim()); col = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && next === "\n") i++;
        row.push(col.trim());
        if (row.some(c => c !== "")) rows.push(row);
        row = []; col = "";
      } else col += ch;
    }
  }
  if (col.length || row.length) {
    row.push(col.trim());
    if (row.some(c => c !== "")) rows.push(row);
  }
  return rows;
}

function handleCSVUpload(e) {
  e.preventDefault();
  const title = document.getElementById("adm-title").value.trim();
  const category = document.getElementById("adm-cat").value;
  const paperType = document.getElementById("adm-paper").value;
  const durationMins = Number(document.getElementById("adm-dur").value) || 120;
  const isFree = document.getElementById("adm-free").checked;
  const syllabus = document.getElementById("adm-syl").value.trim() || "Full Syllabus";
  const fileInput = document.getElementById("adm-csv");

  if (!fileInput.files.length) {
    alert("Please select a .csv file first.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function (ev) {
    const rows = parseCSV(ev.target.result);
    if (rows.length < 2) {
      alert("CSV must contain a header row and at least 1 question.");
      return;
    }
    const mapAns = { A: 0, B: 1, C: 2, D: 3, "0": 0, "1": 1, "2": 2, "3": 3 };
    const questions = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length < 10) continue;
      questions.push({
        no: Number(r[0]) || i,
        subject: r[1] || "General Studies",
        topic: r[2] || "Core",
        text: r[3],
        options: [r[4], r[5], r[6], r[7]],
        correct: mapAns[(r[8] || "A").toUpperCase()] ?? 0,
        axiom: r[9] || "Core principle verified from standard sources.",
        deduction: r[10] || "",
        trap: r[11] || ""
      });
    }
    if (!questions.length) {
      alert("No valid questions found in CSV. Check the column order.");
      return;
    }
    state.tests.unshift({
      id: "custom_" + Date.now(),
      title, category, paperType, durationMins, isFree, syllabus, questions
    });
    saveState();
    alert(`Published "${title}" with ${questions.length} questions!`);
    render();
  };
  reader.readAsText(fileInput.files[0]);
}

function renderExam() {
  const test = state.activeTest;
  const q = test.questions[state.qIndex];
  const letters = ["(a)", "(b)", "(c)", "(d)"];
  const marksLabel = test.paperType === "CSAT" ? "+2.50 / -0.83" : "+2.00 / -0.66";

  const paletteItems = test.questions.map((_, i) => {
    let cls = "bg-slate-100 text-slate-700 border-slate-300";
    if (state.marked[i]) cls = "bg-purple-600 text-white border-purple-700";
    else if (state.answers[i] !== undefined) cls = "bg-emerald-600 text-white border-emerald-700";
    else if (state.visited[i]) cls = "bg-red-500 text-white border-red-600";
    const ring = i === state.qIndex ? "ring-2 ring-slate-900 ring-offset-1" : "";
    return `<button onclick="goToQuestion(${i})" class="h-9 rounded-lg border text-xs font-bold ${cls} ${ring}">${i + 1}</button>`;
  }).join("");

  return `
    <!-- Sticky Exam Status Bar -->
    <div class="bg-white border border-slate-200 rounded-2xl p-3 sm:p-4 mb-4 flex flex-wrap items-center justify-between gap-2 shadow-xs">
      <div>
        <div class="font-bold text-sm text-slate-900">${escapeHtml(test.title)}</div>
        <div class="text-[11px] text-slate-500">Q ${state.qIndex + 1} of ${test.questions.length} • ${escapeHtml(q.subject)} (${marksLabel})</div>
      </div>
      <div class="flex items-center gap-2">
        <div id="exam-timer" class="px-3 py-1.5 rounded-lg bg-slate-800 text-emerald-300 font-mono font-bold text-xs sm:text-sm">
          ${formatTime(state.remainingSecs)}
        </div>
        <button onclick="state.paletteOpen = !state.paletteOpen; render();" class="lg:hidden px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-300 text-xs font-bold">
          Palette
        </button>
        <button onclick="confirmSubmitExam()" class="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs">
          Submit
        </button>
      </div>
    </div>

    <div class="grid lg:grid-cols-12 gap-5 items-start">
      <!-- Question Panel -->
      <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-extrabold uppercase tracking-wider text-slate-900">Question ${state.qIndex + 1}</span>
          <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700">${escapeHtml(q.subject)} • ${escapeHtml(q.topic)}</span>
        </div>

        <div class="text-sm sm:text-base text-slate-900 leading-relaxed whitespace-pre-line font-medium mb-5">
          ${escapeHtml(q.text)}
        </div>

        <div class="space-y-2.5">
          ${q.options.map((opt, idx) => {
            const selected = state.answers[state.qIndex] === idx;
            const struck = state.strikes[`${state.qIndex}-${idx}`];
            return `
              <div onclick="selectOption(${idx})" class="cursor-pointer p-3.5 rounded-xl border transition flex items-start justify-between gap-3 ${selected ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 hover:border-slate-400 bg-white text-slate-800'}">
                <div class="text-sm leading-snug ${struck ? 'line-strike' : ''}">
                  <span class="font-bold mr-1.5">${letters[idx]}</span> ${escapeHtml(opt)}
                </div>
                <button onclick="toggleStrike(event, ${idx})" title="Strike out eliminated option" class="shrink-0 text-[11px] font-bold px-2 py-0.5 rounded border ${selected ? 'border-slate-600 text-slate-300' : 'border-slate-300 text-slate-500 hover:bg-slate-100'}">
                  S
                </button>
              </div>
            `;
          }).join("")}
        </div>

        <div class="mt-6 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2">
          <div class="flex gap-2">
            <button onclick="clearResponse()" class="px-3 py-2 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50">Clear</button>
            <button onclick="markAndNext()" class="px-3 py-2 rounded-lg border border-purple-300 bg-purple-50 text-xs font-semibold text-purple-800 hover:bg-purple-100">
              ${state.marked[state.qIndex] ? 'Unmark & Next' : 'Mark for Review'}
            </button>
          </div>
          <button onclick="saveAndNext()" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">
            Save & Next →
          </button>
        </div>
      </div>

      <!-- Desktop + Mobile Slide Palette -->
      <aside class="${state.paletteOpen ? 'block' : 'hidden'} lg:block lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-sm text-slate-900">Question Palette</h3>
          <button onclick="state.paletteOpen=false; render();" class="lg:hidden text-xs text-slate-500">Close</button>
        </div>
        <div class="grid grid-cols-5 gap-2 mb-4">${paletteItems}</div>
        <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-600 pt-3 border-t border-slate-200">
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-600"></span> Answered</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-red-500"></span> Not Answered</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-purple-600"></span> Marked</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-200 border border-slate-300"></span> Not Visited</div>
        </div>
      </aside>
    </div>
  `;
}

function renderResults() {
  const att = state.attempts.find(a => a.id === state.activeAttemptId) || state.attempts[0];
  if (!att) return `<p class="text-sm text-slate-500">No attempts yet.</p>`;
  const test = state.tests.find(t => t.id === att.testId) || DEFAULT_TESTS[0];
  const letters = ["(a)", "(b)", "(c)", "(d)"];

  const subjectBars = Object.entries(att.subjectStats).map(([subj, d]) => {
    const pct = Math.round((d.correct / d.total) * 100);
    return `
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span>${escapeHtml(subj)}</span>
          <span>${d.correct}/${d.total} (${pct}%)</span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-slate-900 rounded-full" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join("");

  const filteredQs = test.questions.map((q, i) => ({ q, i })).filter(({ q, i }) => {
    const ans = att.answers[i];
    if (state.reviewFilter === "correct") return ans === q.correct;
    if (state.reviewFilter === "incorrect") return ans !== undefined && ans !== q.correct;
    if (state.reviewFilter === "unattempted") return ans === undefined;
    return true;
  });

  return `
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Diagnostic Scorecard</h1>
        <p class="text-xs text-slate-500">${escapeHtml(att.testTitle)} • ${att.date}</p>
      </div>
      <button onclick="navigate('dashboard')" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">← Dashboard</button>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="bg-white p-4 rounded-2xl border border-slate-200">
        <div class="text-xs text-slate-500 font-semibold">Net Score</div>
        <div class="text-2xl font-black text-slate-900 mt-1">${att.netScore} <span class="text-xs font-normal text-slate-400">/ ${att.maxScore}</span></div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200">
        <div class="text-xs text-slate-500 font-semibold">Accuracy</div>
        <div class="text-2xl font-black text-emerald-600 mt-1">${att.accuracy}%</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200">
        <div class="text-xs text-slate-500 font-semibold">Negative Marks Lost</div>
        <div class="text-2xl font-black text-red-600 mt-1">-${att.negLost}</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200">
        <div class="text-xs text-slate-500 font-semibold">Split (C / W / U)</div>
        <div class="text-xl font-black text-slate-900 mt-1">${att.correct} / ${att.incorrect} / ${att.unattempted}</div>
      </div>
    </div>

    <div class="bg-white p-5 rounded-2xl border border-slate-200 mb-6">
      <h2 class="font-bold text-sm text-slate-900 mb-3">Subject-Wise Accuracy</h2>
      <div class="grid sm:grid-cols-2 gap-4">${subjectBars}</div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <h2 class="font-bold text-base text-slate-900">First-Principles Solution Review</h2>
      <div class="flex gap-1.5 text-xs">
        ${["all", "correct", "incorrect", "unattempted"].map(f => `
          <button onclick="state.reviewFilter='${f}'; render();" class="px-3 py-1.5 rounded-lg font-semibold capitalize ${state.reviewFilter === f ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600'}">${f}</button>
        `).join("")}
      </div>
    </div>

    <div class="space-y-4">
      ${filteredQs.map(({ q, i }) => {
        const userAns = att.answers[i];
        const isRight = userAns === q.correct;
        const isUn = userAns === undefined;
        const bKey = `${test.id}::${q.no}`;
        const bookmarked = state.bookmarks.includes(bKey);
        const tag = att.mistakeTags[i] || "";

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-slate-900">Q${i + 1}</span>
                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isUn ? 'bg-slate-100 text-slate-600' : (isRight ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700')}">
                  ${isUn ? 'Unattempted' : (isRight ? '✓ Correct' : '✗ Incorrect')}
                </span>
                <span class="text-[11px] text-slate-500">⏱ ${att.timeSpent[i] || 0}s</span>
              </div>
              <button onclick="toggleBookmark('${test.id}', ${q.no})" class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${bookmarked ? 'bg-amber-50 border-amber-300 text-amber-800' : 'border-slate-200 text-slate-600'}">
                ${bookmarked ? '🔖 Bookmarked' : 'Bookmark'}
              </button>
            </div>

            <div class="text-sm text-slate-900 whitespace-pre-line font-medium mb-3">${escapeHtml(q.text)}</div>

            <div class="grid sm:grid-cols-2 gap-2 text-xs mb-4">
              ${q.options.map((opt, oIdx) => {
                let style = "border-slate-200 bg-slate-50 text-slate-700";
                if (oIdx === q.correct) style = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
                else if (oIdx === userAns && userAns !== q.correct) style = "border-red-400 bg-red-50 text-red-800 font-semibold";
                return `<div class="p-2.5 rounded-lg border ${style}">${letters[oIdx]} ${escapeHtml(opt)}</div>`;
              }).join("")}
            </div>

            ${!isRight ? `
              <div class="flex flex-wrap items-center gap-1.5 mb-4 text-[11px]">
                <span class="text-slate-500 font-semibold">Tag Mistake:</span>
                ${["Conceptual Gap", "Silly Error", "Over-Attempted Guess"].map(t => `
                  <button onclick="setMistakeTag('${att.id}', ${i}, '${t}')" class="px-2.5 py-1 rounded-full border font-semibold ${tag === t ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300'}">${t}</button>
                `).join("")}
              </div>
            ` : ""}

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2 text-xs leading-relaxed">
              <div><strong class="text-slate-900 uppercase tracking-wide">1. Core Axiom:</strong> <span class="text-slate-700">${escapeHtml(q.axiom)}</span></div>
              <div><strong class="text-slate-900 uppercase tracking-wide">2. Deduction:</strong> <span class="text-slate-700">${escapeHtml(q.deduction)}</span></div>
              <div><strong class="text-red-700 uppercase tracking-wide">3. Trap Diagnosis:</strong> <span class="text-slate-700">${escapeHtml(q.trap)}</span></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderBookmarks() {
  const items = [];
  state.bookmarks.forEach(key => {
    const [tid, qNo] = key.split("::");
    const test = state.tests.find(t => t.id === tid);
    const q = test?.questions.find(x => String(x.no) === String(qNo));
    if (test && q) items.push({ test, q });
  });

  return `
    <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Revision Notebook</h1>
    <p class="text-xs text-slate-500 mb-6">Your bookmarked high-yield traps and First-Principles explanations.</p>
    ${!items.length ? `
      <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
        <p class="text-sm text-slate-600">No bookmarked questions yet. Bookmark questions from your Post-Test Solution Review.</p>
        <button onclick="navigate('dashboard')" class="mt-4 px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Go to Mock Tests</button>
      </div>
    ` : `
      <div class="space-y-4">
        ${items.map(({ test, q }) => `
          <div class="bg-white rounded-2xl border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-emerald-700">${escapeHtml(test.title)} • ${escapeHtml(q.subject)}</span>
              <button onclick="toggleBookmark('${test.id}', ${q.no})" class="text-xs text-red-600 font-semibold">Remove</button>
            </div>
            <div class="text-sm font-medium whitespace-pre-line mb-3">${escapeHtml(q.text)}</div>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-1">
              <div><strong>Answer:</strong> ${escapeHtml(q.options[q.correct])}</div>
              <div><strong>Core Axiom:</strong> ${escapeHtml(q.axiom)}</div>
              <div><strong>Trap:</strong> ${escapeHtml(q.trap)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `}
  `;
}

            </label>
          </div>
          <input id="adm-syl" placeholder="Syllabus / Topics Covered" class="w-full px-3 py-2 rounded-lg border border-slate-300" />
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Upload .csv File</label>
            <input id="adm-csv" type="file" accept=".csv,text/csv" required class="w-full text-xs" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold">Publish Mock Test</button>
        </form>
      </div>

      <!-- Pricing & Free Payment Link Settings -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-bold text-base text-slate-900 mb-3">2. Pricing & Payment Settings</h2>
        <form onsubmit="saveAdminSettings(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-semibold mb-1">Price (₹)</label>
              <input id="cfg-price" type="number" value="${state.config.bundlePrice}" class="w-full px-3 py-2 rounded-lg border border-slate-300" />
            </div>
            <div>
              <label class="block font-semibold mb-1">Coupon</label>
              <input id="cfg-coupon" value="${escapeHtml(state.config.couponCode)}" class="w-full px-3 py-2 rounded-lg border border-slate-300 uppercase" />
            </div>
            <div>
              <label class="block font-semibold mb-1">Discount %</label>
              <input id="cfg-disc" type="number" value="${state.config.couponDiscount}" class="w-full px-3 py-2 rounded-lg border border-slate-300" />
            </div>
          </div>
          <div>
            <label class="block font-semibold mb-1">Optional Free Hosted Payment Link (Topmate / Razorpay Page)</label>
            <input id="cfg-ext-url" type="url" value="${escapeHtml(state.config.externalCheckoutUrl)}" placeholder="https://topmate.io/... or https://rzp.io/l/..." class="w-full px-3 py-2 rounded-lg border border-slate-300" />
          </div>
          <div>
            <label class="block font-semibold mb-1">Brand Support Email (Footer & Policies)</label>
            <input id="cfg-email" type="email" value="${escapeHtml(state.config.supportEmail)}" class="w-full px-3 py-2 rounded-lg border border-slate-300" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Save Configuration</button>
        </form>
      </div>
    </div>

    <!-- Manage Existing Tests -->
    <div class="mt-6 bg-white rounded-2xl border border-slate-200 p-5">
      <h2 class="font-bold text-base text-slate-900 mb-3">3. Published Mock Tests (${state.tests.length})</h2>
      <div class="space-y-2 text-xs">
        ${state.tests.map(t => `
          <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-xl border border-slate-200 bg-slate-50">
            <div>
              <div class="font-bold text-slate-900">${escapeHtml(t.title)}</div>
              <div class="text-slate-500">${t.questions.length} Qs • ${t.paperType} • ${t.isFree ? 'FREE' : 'PAID'}</div>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleTestFree('${t.id}')" class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 font-semibold">${t.isFree ? 'Make Paid' : 'Make Free'}</button>
              <button onclick="deleteTest('${t.id}')" class="px-2.5 py-1 rounded-lg bg-red-50 text-red-700 border border-red-200 font-semibold">Delete</button>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

// Initial Render
render();
</script>
</body>
</html>
